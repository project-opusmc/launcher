[package]
name = "opus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opus"
path = "src/main.rs"

[features]
# This only forwards the non-default engine feature. The command itself is
# additionally compiled only for debug builds, so release CLI/UI artifacts
# cannot expose the OPUS-owned M3 preview lane.
opus-owned-m3-preview = ["opus-engine/opus-owned-m3-preview"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
open.workspace = true
opus-auth = { path = "../auth" }
opus-platform = { path = "../platform" }
opus-engine = { path = "../engine" }
