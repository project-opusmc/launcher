[workspace]
resolver = "2"
members = [
    "desktop/src-tauri",
    "crates/auth",
    "crates/cli",
    "crates/engine",
    "crates/platform",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "All rights reserved"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.54", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
getrandom = "0.3.4"
keyring = "4.1.6"
md5 = { package = "md-5", version = "0.10.6" }
open = "5.4.1"
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
shlex = "1.3.0"
tempfile = "3.24.0"
thiserror = "2.0.17"
tauri = "2.11.5"
tauri-build = "2.6.3"
url = "2.5.7"
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
