[package]
name = "opus-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "opus_launcher"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Developer-only launcher simulation. This feature is deliberately non-default
# and is additionally guarded by `debug_assertions` in the implementation, so
# it is never registered in a release build.
developer-test-profile = []
# Quarantined historical source only. Supported build runners do not select it.
ui-preview = ["opus-engine/ui-preview-artifact"]

[[bin]]
name = "opus-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
open.workspace = true
opus-auth = { path = "../../crates/auth" }
opus-platform = { path = "../../crates/platform" }
opus-engine = { path = "../../crates/engine" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[dev-dependencies]
tempfile.workspace = true
